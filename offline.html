<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're offline — SEBA</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f9fafb;
    color: #111827;
  }
  .card {
    text-align: center;
    max-width: 360px;
    padding: 32px;
  }
  .dot {
    width: 48px;
    height: 48px;
    border-radius: 9999px;
    background: #fff7ed;
    color: #ea580c;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 22px;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 14px; color: #6b7280; margin: 0 0 20px; line-height: 1.5; }
  button {
    background: #ea580c;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #c2410c; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot">📶</div>
    <h1>You're offline</h1>
    <p>
      This page isn't cached yet, so SEBA can't load it right now. Your
      notifications that were already loaded are still available on the
      Notifications page — this screen only shows up for pages you haven't
      opened before.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
